<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .toolbar { display:inline-flex; flex-direction:column; padding: 4px; border:1px solid #b9b7b6; background: rgba(255,255,255,0.95); border-radius:8px; box-shadow: -1px 4px 8px 0 rgba(0,0,0,0.08); gap:4px; }
  .tbtn { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#101010; }
  .tbtn:hover { background: #e8f6ff; }
  .tbtn.active { background: #d5eeff; }
  .sep { height:1px; background:#e3e3e3; margin: 4px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="row" style="gap:24px;align-items:flex-start">
    <div class="toolbar">
      <div class="tbtn active"><img src="../assets/icons/cursor.svg" width="20" height="20"></div>
      <div class="tbtn"><img src="../assets/icons/frame.svg" width="20" height="20"></div>
      <div class="tbtn"><img src="../assets/icons/text.svg" width="20" height="20"></div>
      <div class="sep"></div>
      <div class="tbtn"><img src="../assets/icons/add.svg" width="20" height="20"></div>
    </div>
    <div class="col" style="gap:6px">
      <div class="label">CANVAS TOOLBAR</div>
      <div class="mono">move · frame · text · add image</div>
      <div class="mono" style="margin-top:6px">hover → highlight-2 · active → highlight-4</div>
      <div class="mono">36px hit · 8px radius · 4px gap</div>
    </div>
  </div>
</div>
</body></html>

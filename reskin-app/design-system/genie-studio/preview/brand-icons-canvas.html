<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(7, 36px); grid-auto-rows: 36px; gap: 12px; align-items:center; justify-items:center; }
  .grid img { width:24px; height:24px; color:#101010; }
  .lbl { grid-column: 1 / -1; font-size:11px; color:#787673; font-family: ui-monospace, monospace; justify-self:start; }
</style>
</head>
<body>
<div class="card">
  <div class="label">CANVAS ICONS — bespoke 24×24 set</div>
  <div class="grid">
    <img src="../assets/icons/cursor.svg" title="cursor">
    <img src="../assets/icons/cursor-fill.svg" title="cursor-fill">
    <img src="../assets/icons/hand.svg" title="hand">
    <img src="../assets/icons/frame.svg" title="frame">
    <img src="../assets/icons/text.svg" title="text">
    <img src="../assets/icons/add.svg" title="add">
    <img src="../assets/icons/hamburger.svg" title="hamburger">

    <img src="../assets/icons/zoom.svg" title="zoom">
    <img src="../assets/icons/copy.svg" title="copy">
    <img src="../assets/icons/chevron-down.svg" title="chevron-down">
    <img src="../assets/icons/align-left.svg" title="align-left">
    <img src="../assets/icons/align-center.svg" title="align-center">
    <img src="../assets/icons/align-right.svg" title="align-right">
    <img src="../assets/icons/frame-label.svg" title="frame-label">
  </div>
  <div class="mono">stroke 1.5 · round caps/joins · currentColor · 24×24</div>
</div>
</body></html>

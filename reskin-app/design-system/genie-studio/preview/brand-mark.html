<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row3 { display:flex; align-items:center; gap:24px; padding: 8px 0; }
  .mark { width: 88px; height: 88px; border-radius: 16px; background:#fff; border:1px solid #e3e3e3; display:flex; align-items:center; justify-content:center; }
  .mark img { width: 56px; height:56px; }
  .mark.dark { background: #142938; border-color:#142938; }
  .mark.tint { background: #cceaff; border-color:#b0dfff; }
</style>
</head>
<body>
<div class="card">
  <div class="label">BRAND MARK — the lamp swoosh</div>
  <div class="row3">
    <div class="mark"><img src="../assets/genie-icon.svg" alt="Genie"></div>
    <div class="mark dark"><img src="../assets/genie-icon.svg" alt="Genie"></div>
    <div class="mark tint"><img src="../assets/genie-icon.svg" alt="Genie"></div>
    <div class="col" style="gap:4px">
      <div class="mono">single path · genie-4 fill</div>
      <div class="mono">never recolor outside genie-* scale</div>
      <div class="mono">favicon, watermark, brand moments only</div>
    </div>
  </div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .stack { display:flex; flex-direction:column; gap:12px; }
  .row2 { display:flex; align-items:baseline; gap:16px; }
  .row2 .meta { color: var(--charcoal-4); font-size: 11px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="card">
  <div class="stack">
    <div class="row2"><span style="font-size:14px">Describe what you'd like to create</span><span class="meta">body · 14 / 400</span></div>
    <div class="row2"><span style="font-size:14px;font-weight:500">+ New board</span><span class="meta">button · 14 / 500</span></div>
    <div class="row2"><span style="font-size:14px;color:#787673">Your canvas workspaces</span><span class="meta">muted · 14 / 400 / charcoal-4</span></div>
    <div class="row2"><span style="font-size:12px;color:#787673">Edited 3 days ago</span><span class="meta">caption · 12 / 400 / charcoal-4</span></div>
    <div class="row2"><span style="font-size:12px;font-weight:500;color:#373634;letter-spacing:.01em">CONVERSATION</span><span class="meta">label · 12 / 500</span></div>
    <div class="row2"><span style="font-size:10px;font-weight:500">⌘K</span><span class="meta">xxs · 10 / 500 (kbd)</span></div>
  </div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .bcard { width: 220px; border:1px solid #e3e3e3; border-radius:8px; background:#fff; box-shadow: 0 1px 2px 1px rgba(0,0,0,0.04); overflow:hidden; }
  .thumb { aspect-ratio: 4/3; background: linear-gradient(to bottom right, #f9f9f9, #e3e3e3); display:flex; align-items:center; justify-content:center; color:#787673; font-size:13px; }
  .meta { padding: 12px; }
  .meta h3 { margin:0; font-size:14px; font-weight:500; color:#101010; }
  .meta p { margin: 2px 0 0; font-size:12px; color:#787673; }
</style>
</head>
<body>
<div class="card">
  <div class="label">BOARD CARD — boards list</div>
  <div class="row">
    <div class="bcard">
      <div class="thumb">No preview</div>
      <div class="meta"><h3>Untitled board</h3><p>Edited 3 days ago</p></div>
    </div>
    <div class="bcard">
      <div class="thumb" style="background:#f6cab4"></div>
      <div class="meta"><h3>Cereal box concepts</h3><p>Edited 14 hours ago</p></div>
    </div>
  </div>
</div>
</body></html>
